<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Unidades</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Conversor de Unidades</h1>
        <p class="subtitle">Converta temperatura, comprimento e massa rapidamente</p>

        <div class="form-group">
            <label for="category">Categoria:</label>
            <select id="category">
                <option value="length">Comprimento</option>
                <option value="weight">Massa / Peso</option>
                <option value="temperature">Temperatura</option>
            </select>
        </div>

        <div class="conversion-grid">
            <div class="form-group">
                <label for="input-value">Valor:</label>
                <input type="number" id="input-value" value="1" placeholder="Digite o valor">
            </div>

            <div class="form-group">
                <label for="from-unit">De:</label>
                <select id="from-unit"></select>
            </div>

            <div class="form-group">
                <label for="to-unit">Para:</label>
                <select id="to-unit"></select>
            </div>
        </div>

        <div class="result-box">
            <span>Resultado:</span>
            <strong id="result-text">---</strong>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
